---
name: "Release"
on:
  workflow_dispatch:
  pull_request_target:
    types: [closed]
    branches:
      - main
jobs:
  release:
    permissions:
      contents: write       # Create release and push tags
      pull-requests: read   # Read PR labels for release-drafter
      packages: write       # Push container image to ghcr.io
      id-token: write       # Federate for artifact attestation
      attestations: write   # Generate build provenance attestations
      discussions: write    # Create release announcement discussion
    uses: github-community-projects/ospo-reusable-workflows/.github/workflows/release.yaml@ee8277bd76ef808b3a6e0bdd1f5a46a520a12c5d # v2.3.1
    with:
      publish: true
      release-config-name: release-drafter.yml
      release-only-with-label: true
    secrets:
      github-token: ${{ secrets.GITHUB_TOKEN }}
  publish-cue:
    needs: release
    if: needs.release.outputs.full-tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Setup Cue
        uses: cue-lang/setup-cue@b0e30e540a2dae47304ebf16586a5b2db023b61c # v2.0.0
        with:
          version: "v0.15.1"
      - name: Login to Central Registry
        run: cue login --token=${{ secrets.CUE_REG_TOKEN }}
      - name: Publish the module
        run: cue mod publish ${{ needs.release.outputs.full-tag }}
  publish-assets:
    # Downstream consumers (website, gemara-python, etc.) consume the spec's
    # OpenAPI projection and canonical JSON Schema, so attach both to the
    # release as versioned assets.
    needs: release
    if: needs.release.outputs.full-tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write   # Upload the release assets
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release.outputs.full-tag }}
          persist-credentials: false
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: cmd/go.mod
      - name: Setup Cue
        uses: cue-lang/setup-cue@b0e30e540a2dae47304ebf16586a5b2db023b61c # v2.0.0
        with:
          version: "v0.15.1"
      - name: Generate openapi.yaml
        run: make genopenapi
      - name: Generate gemara-v1.schema.json
        run: make genjsonschema
      - name: Upload release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.release.outputs.full-tag }}
        run: gh release upload "$TAG" generated/openapi.yaml generated/gemara-v1.schema.json --clobber
  notify-downstream:
    # Downstream repos regenerate their reference pages and SDK models from
    # the released spec, so notify them that a new release exists. This must
    # happen here rather than in an `on: release` workflow in each downstream
    # repo: the release is created with GITHUB_TOKEN, whose events do not
    # trigger other workflows.
    #
    # Runs after publish-assets so consumers find openapi.yaml and
    # gemara-v1.schema.json already attached instead of racing the upload.
    needs: [release, publish-assets]
    if: needs.release.outputs.full-tag != ''
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Generate GitHub App token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app-token
        with:
          client-id: ${{ secrets.GEMARA_AUTOMATION_CLIENT_ID }}
          private-key: ${{ secrets.GEMARA_AUTOMATION_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: "website,gemara-python"
          permission-contents: write
      - name: Dispatch release notification
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          TAG: ${{ needs.release.outputs.full-tag }}
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            const consumers = ['website', 'gemara-python'];
            for (const repo of consumers) {
              await github.rest.repos.createDispatchEvent({
                owner: context.repo.owner,
                repo: repo,
                event_type: 'gemara-release',
                client_payload: { ref: process.env.TAG },
              });
            }
