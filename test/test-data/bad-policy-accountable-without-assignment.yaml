metadata:
  id: "bad-policy-accountable-without-assignment-001"
  type: Policy
  gemara-version: "1.1.0"
  description: "Policy with accountable role that has no standing assignment"
  version: "1.0.0"
  author:
    id: security-team
    name: "Security Team"
    type: Human

title: "Bad Policy Accountable Role Without Assignment"

stakeholders:
  parties:
    - id: sec-ops
      name: Security Operations
      type: Group
  roles:
    - id: responsible-role
      title: Responsible Role
    - id: unassigned-accountable
      title: Unassigned Accountable Role
  assignments:
    - role-id: responsible-role
      party-ids:
        - sec-ops

contacts:
  responsible:
    - responsible-role
  accountable:
    - unassigned-accountable

scope:
  in:
    technologies:
      - "Cloud Computing"

imports:
  catalogs:
    - reference-id: "NIST-800-53"

adherence:
  non-compliance: "Non-compliant systems will be quarantined pending remediation"
