metadata:
  id: "multi-source-policy-001"
  type: Policy
  gemara-version: "1.1.0"
  description: "Policy exercising multi-source evaluation of one assessment requirement"
  version: "1.0.0"
  author:
    id: security-team
    name: "Security Team"
    type: Human
  mapping-references:
    - id: "OSPS"
      title: "Open Source Project Security Baseline"
      version: "2025-02-25"
      description: "Baseline used by the assessment requirements below"
      url: "https://baseline.openssf.org/"

title: "Multi-source evaluation policy"
contacts:
  responsible:
    - name: "Platform Lead"
      affiliation: "Platform"
      email: "platform-lead@example.com"
  accountable:
    - name: "Security Director"
      affiliation: "Security"
      email: "security-director@example.com"

scope:
  in:
    technologies:
      - "Container Images"

imports:
  catalogs:
    - reference-id: "OSPS"

adherence:
  evaluation-methods:
    - id: "EV-AUTO-01"
      type: "Behavioral"
      mode: "Automated"
      required: true
      description: "Automated scanning"
  enforcement-methods:
    - id: "EM-GATE-01"
      type: "Gate"
      mode: "Automated"
      required: true
      description: "Pre-deployment gate"
  non-compliance: "Non-compliant builds are blocked at the gate"
  assessment-plans:
    - id: "AP-BUILD-PROV-05"
      requirement-id: "OSPS-BR-05"
      frequency: "per-release"
      evaluation-methods:
        - id: "EV-SCANNER-A"
          type: "Behavioral"
          mode: "Automated"
          environment-requirements:
            label: "production"
            digests:
              - "SHA256:6b5f0c1e2a4d8f3b9c7e0a1d2f4b6c8e0a1d3f5b7c9e1a3d5f7b9c1e3a5d7f90"
