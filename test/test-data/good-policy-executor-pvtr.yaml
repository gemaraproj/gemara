# The plan pins what a policy author knows before any run: the scanner image digest and
# the parameters whose accepted values do not change per target. org and repo are
# parameters with no accepted-values, so each target's value is recorded by the log.
metadata:
  id: "security-policy-executor-pvtr"
  type: Policy
  gemara-version: "1.1.0"
  description: "Establish comprehensive information security controls and procedures to protect organizational assets"
  version: "2.1.0"
  author:
    id: security-team
    name: "Security Team"
    type: Human
    contact:
      name: "Security Team Lead"
      affiliation: "Security Department"
      email: "security-lead@company.com"
  mapping-references:
    - id: "NIST-800-53"
      title: "NIST Special Publication 800-53"
      version: "Rev. 5"
      description: "Security and Privacy Controls for Federal Information Systems"
      url: "https://csrc.nist.gov/publications/detail/sp/800-53/rev-5/final"
    - id: "ISO-27001"
      title: "ISO/IEC 27001"
      version: "2022"
      description: "Information security management systems"
      url: "https://www.iso.org/standard/27001"

title: "Information Security Policy"
contacts:
  responsible:
    - name: "IT Director"
      affiliation: "Information Technology"
      email: "it-director@company.com"
    - name: "Compliance Officer"
      affiliation: "Legal & Compliance"
      email: "compliance@company.com"
  accountable:
    - name: "Chief Information Security Officer"
      affiliation: "Executive Team"
      email: "ciso@company.com"
  consulted:
    - name: "Legal Counsel"
      affiliation: "Legal Department"
      email: "legal@company.com"
  informed:
    - name: "All Employees"
      affiliation: "Company-wide"

scope:
  in:
    geopolitical:
      - "United States"
      - "European Union"
      - "Canada"
    technologies:
      - "Cloud Computing"
      - "Mobile Devices"
      - "Web Applications"
      - "Database Systems"

imports:
  catalogs:
    - reference-id: "NIST-800-53"
      constraints:
        - id: "nist-cloud-constraint"
          target-id: "AC-1"
          text: "Enhanced access control requirements for cloud environments"
      assessment-requirement-modifications:
        - id: "nist-ac1-mod"
          target-id: "AC-1.1"
          modification-type: "Modify"
          modification-rationale: "Clarified assessment procedures for multi-cloud environments"
          text: "Assessment procedures must include multi-cloud environment considerations"
          applicability:
            - "cloud"
            - "multi-cloud"
          recommendation: "Conduct quarterly assessments"
  guidance:
    - reference-id: "ISO-27001"

adherence:
  assessment-plans:
    - id: "AP-OSPS-BASELINE"
      requirement-id: "OSPS-B"
      frequency: "Per release"
      evaluation-methods:
        - id: "EV-PVTR-01"
          type: "Behavioral"
          mode: "Automated"
          required: true
          description: "OpenSSF Baseline checks of the project repository by the pvtr scanner"
          executor:
            id: pvtr
            name: PVTR
            type: Software
            version: "1.5.0"
            uri: "oci://registry.example.com/pvtr-github-repo:1.5.0"
            execution-environment:
              digests:
                - "sha256:3b6a07d0d404fab4e23b6d34bc6696a6a312dd92821332385e5af7c01c421351"
      parameters:
        - id: "catalog"
          label: "Baseline catalog"
          description: "Version of the OSPS Baseline catalog the scanner evaluates against"
          accepted-values:
            - "osps-baseline-2025-10"
        - id: "token-scope"
          label: "Token scope"
          description: "Scope of the token the scanner reads GitHub with"
          accepted-values:
            - "repo:read"
        - id: "org"
          label: "Organisation"
          description: "GitHub organisation scanned; differs for each target"
        - id: "repo"
          label: "Repository"
          description: "GitHub repository scanned; differs for each target"
  evaluation-methods:
    - id: "EV-MANUAL-01"
      type: "Behavioral"
      mode: "Manual"
      description: "Annual security audit by external assessors"
  enforcement-methods:
    - id: "EM-GATE-01"
      type: "Gate"
      mode: "Automated"
      required: true
      description: "Pre-deployment compliance gate in CI/CD pipeline"
  non-compliance: "Non-compliant systems will be quarantined pending remediation"
