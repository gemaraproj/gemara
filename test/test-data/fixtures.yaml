# What each fixture is for and how it should fare. test/manifest_test.go checks
# every row against the CUE and fails if a file under test/test-data has no row.
# Paths are relative to the repository root. Keep rows sorted by first file.
# schema.error is a substring of one CUE error message for that file.
# Each bad fixture should start from a valid one and break exactly one rule,
# because CUE may report only some of several defects.
fixtures:
  - files: [examples/ai-agent/ai-agent-capability-catalog.yaml]
    definition: '#CapabilityCatalog'
    schema:
      valid: true
    reason: 'valid AI agent capability catalog'

  - files: [examples/ai-agent/atr-categories-to-capabilities-mapping.yaml]
    definition: '#MappingDocument'
    schema:
      valid: true
    reason: 'valid ATR categories to capabilities mapping'

  - files: [test/test-data/bad-audit-log-duplicate-result-id.yaml]
    definition: '#AuditLog'
