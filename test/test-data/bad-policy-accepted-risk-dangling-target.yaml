metadata:
  id: "security-policy-risks-001"
  type: Policy
  gemara-version: "1.1.0"
  description: "Policy demonstrating resolved mitigated and accepted risks"
  version: "1.0.0"
  author:
    id: security-team
    name: "Security Team"
    type: Human
    contact:
      name: "Security Team Lead"
      affiliation: "Security Department"
      email: "security-lead@company.com"
  mapping-references:
    - id: "ISO-27001"
      title: "ISO/IEC 27001"
      version: "2022"
      description: "Information security management systems"
      url: "https://www.iso.org/standard/27001"

title: "Information Security Policy with Risks"
stakeholders:
  parties:
    - id: it-director
      name: IT Director
      type: Human
      contact:
        name: "IT Director"
        affiliation: "Information Technology"
        email: "it-director@company.com"
    - id: ciso
      name: Chief Information Security Officer
      type: Human
      contact:
        name: "Chief Information Security Officer"
        affiliation: "Executive Team"
        email: "ciso@company.com"
  roles:
    - id: it-director
      title: IT Director
    - id: ciso
      title: Chief Information Security Officer
  assignments:
    - role-id: it-director
      party-ids: [it-director]
    - role-id: ciso
      party-ids: [ciso]

contacts:
  responsible:
    - it-director
  accountable:
    - ciso

scope:
  in:
    technologies:
      - "Cloud Computing"

imports:
  guidance:
    - reference-id: "ISO-27001"

risks:
  mitigated:
    - id: "MIT-ACCESS-01"
      risk:
        reference-id: "ISO-27001"
        entry-id: "A.9.1.1"
  accepted:
    - id: "ACC-VALID-01"
      target-id: "MIT-ACCESS-01"
      risk:
        reference-id: "ISO-27001"
        entry-id: "A.9.1.1"
      justification: "Valid partial mitigation link"
    - id: "ACC-RESIDUAL-01"
      target-id: "A.9.1.1"
      risk:
        reference-id: "ISO-27001"
        entry-id: "A.9.1.1"
      justification: "Mistakenly references external risk entry-id instead of local mitigated risk id"

adherence:
  non-compliance: "Non-compliant systems will be quarantined pending remediation"
