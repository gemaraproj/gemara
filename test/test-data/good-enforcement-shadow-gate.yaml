metadata:
  id: "enforcement-log-shadow-gate"
  type: EnforcementLog
  gemara-version: "1.1.0"
  version: "1.0.0"
  description: "Shadow gate: an action with no effect that reports a failed assessment without acting on it"
  author:
    id: enforcement-engine
    name: "Example Enforcement Engine"
    type: Software
    version: "1.2.0"
    uri: "https://github.com/gemaraproj/gemara"
  mapping-references:
    - id: security-policy
      title: "Information Security Policy"
      version: "2.1.0"
    - id: eval-log
      title: "pvtr Evaluation Log"
      version: "2025-08-22"

effect: None

target:
  id: gemara-repo
  name: "gemaraproj/gemara"
  type: Software
  uri: "https://github.com/gemaraproj/gemara"

actions:
  - effect: None
    method:
      reference-id: security-policy
      entry-id: EM-PASS-01
    message: "Reported without blocking: the gate runs in shadow mode"
    start: "2025-08-22T16:07:00Z"
    steps:
      - github.com/gemaraproj/gemara/enforcement/allow.PassThrough
    justification:
      assessments:
        - result: Failed
          plan:
            reference-id: security-policy
            entry-id: AP-AC-01
          log:
            reference-id: eval-log
            entry-id: OSPS-AC-01
