metadata:
  id: bad-audit-log-unknown-role
  type: AuditLog
  gemara-version: "1.1.0"
  version: "1.0.0"
  description: "Invalid audit log: owner references a role not defined in stakeholders"
  author:
    id: lead-auditor
    name: "Auditor"
    type: Human
  mapping-references:
    - id: security-policy
      title: "Information Security Policy"
      version: "2.1.0"

target:
  id: gemara-repo
  name: "gemaraproj/gemara"
  type: Software
  uri: "https://github.com/gemaraproj/gemara"
  environment: production

stakeholders:
  parties:
    - id: auditor-1
      name: Auditor One
      type: Human
  roles:
    - id: auditor
      title: Lead Auditor

owner:
  responsible:
    - auditor
  accountable:
    - unknown-role

summary: "Owner unknown role test."

criteria:
  - reference-id: security-policy

results:
  - id: AR-AC-01
    title: "MFA enforcement verified"
    type: Strength
    description: "Multi-factor authentication is enforced."
    criteria-reference:
      reference-id: security-policy
