metadata:
  id: "security-policy-exclusions-001"
  type: Policy
  gemara-version: "1.1.0"
  description: "Policy demonstrating exclusions with required rationales on imported catalogs and guidance"
  version: "1.0.0"
  author:
    id: security-team
    name: "Security Team"
    type: Human
    contact:
      name: "Security Team Lead"
      affiliation: "Security Department"
      email: "security-lead@company.com"
  mapping-references:
    - id: "NIST-800-53"
      title: "NIST Special Publication 800-53"
      version: "Rev. 5"
      description: "Security and Privacy Controls for Federal Information Systems"
      url: "https://csrc.nist.gov/publications/detail/sp/800-53/rev-5/final"
    - id: "ISO-27001"
      title: "ISO/IEC 27001"
      version: "2022"
      description: "Information security management systems"
      url: "https://www.iso.org/standard/27001"

title: "Information Security Policy with Exclusions"
contacts:
  responsible:
    - name: "IT Director"
      affiliation: "Information Technology"
      email: "it-director@company.com"
  accountable:
    - name: "Chief Information Security Officer"
      affiliation: "Executive Team"
      email: "ciso@company.com"
  consulted:
    - name: "Legal Counsel"
      affiliation: "Legal Department"
      email: "legal@company.com"
  informed:
    - name: "All Employees"
      affiliation: "Company-wide"

scope:
  in:
    technologies:
      - "Cloud Computing"

imports:
  catalogs:
    - reference-id: "NIST-800-53"
      exclusions:
        - id: "AC-1"
          rationale: "Access control policy is managed by central corporate identity team."
        - id: "AC-2(1)"
          rationale: "Automated account management is handled by external IdP."
  guidance:
    - reference-id: "ISO-27001"
      exclusions:
        - id: "A.5.1"
          rationale: "Covered under parent organization governance framework."

adherence:
  evaluation-methods:
    - id: "EV-AUTO-01"
      type: "Behavioral"
      mode: "Automated"
      required: true
      description: "Automated compliance scanning of cloud environments"
  enforcement-methods:
    - id: "EM-GATE-01"
      type: "Gate"
      mode: "Automated"
      required: true
      description: "Pre-deployment compliance gate in CI/CD pipeline"
