metadata:
  id: "security-policy-with-applicability-groups"
  type: Policy
  gemara-version: "1.1.0"
  description: "Policy demonstrating adoption of specific applicability groups"
  version: "1.0.0"
  author:
    id: security-team
    name: "Security Team"
    type: Human
  mapping-references:
    - id: "OSPS-Baseline"
      title: "OpenSSF OSPS Baseline"
      version: "1.0.0"
      url: "https://github.com/ossf/osps-baseline"
  applicability-groups:
    - id: "maturity-level-1"
      title: "Maturity Level 1"
      description: "Baseline foundational security controls"
    - id: "maturity-level-2"
      title: "Maturity Level 2"
      description: "Advanced operational security controls"

title: "Policy with Adopted Applicability Groups"
stakeholders:
  parties:
    - id: sec-officer
      name: Security Officer
      type: Human
      contact:
        name: "Security Officer"
        affiliation: "Security Team"
        email: "security@example.com"
    - id: ciso
      name: Chief Information Security Officer
      type: Human
      contact:
        name: "Chief Information Security Officer"
        affiliation: "Executive Team"
        email: "ciso@example.com"
    - id: eng-lead
      name: Engineering Lead
      type: Human
      contact:
        name: "Engineering Lead"
        affiliation: "Engineering"
        email: "eng-lead@example.com"
    - id: all-staff
      name: All Staff
      type: Group
      contact:
        name: "Staff Representative"
  roles:
    - id: security-officer
      title: Security Officer
    - id: ciso
      title: Chief Information Security Officer
    - id: engineering-lead
      title: Engineering Lead
    - id: all-staff
      title: All Staff
  assignments:
    - role-id: security-officer
      party-ids: [sec-officer]
    - role-id: ciso
      party-ids: [ciso]
    - role-id: engineering-lead
      party-ids: [eng-lead]
    - role-id: all-staff
      party-ids: [all-staff]

contacts:
  responsible:
    - security-officer
  accountable:
    - ciso
  consulted:
    - engineering-lead
  informed:
    - all-staff

scope:
  in:
    technologies:
      - "Cloud Infrastructure"


imports:
  catalogs:
    - reference-id: "OSPS-Baseline"
      applicability:
        - "maturity-level-2"

adherence:
  evaluation-methods:
    - id: "EV-AUTO-01"
      type: "Behavioral"
      mode: "Automated"
      required: true
      description: "Continuous automated scanning"
  enforcement-methods:
    - id: "EM-GATE-01"
      type: "Gate"
      mode: "Automated"
      required: true
      description: "Deployment pipeline gate"
  non-compliance: "Escalate to security committee"
