metadata:
  id: "security-policy-001"
  type: Policy
  gemara-version: "1.1.0"
  description: "Establish comprehensive information security controls and procedures to protect organizational assets"
  version: "2.1.0"
  author:
    id: security-team
    name: "Security Team"
    type: Human
    contact:
      name: "Security Team Lead"
      affiliation: "Security Department"
      email: "security-lead@company.com"
  mapping-references:
    - id: "NIST-800-53"
      title: "NIST Special Publication 800-53"
      version: "Rev. 5"
      description: "Security and Privacy Controls for Federal Information Systems"
      url: "https://csrc.nist.gov/publications/detail/sp/800-53/rev-5/final"
    - id: "ISO-27001"
      title: "ISO/IEC 27001"
      version: "2022"
      description: "Information security management systems"
      url: "https://www.iso.org/standard/27001"

title: "Information Security Policy"

stakeholders:
  parties:
    - id: it-director
      name: IT Director
      type: Human
      contact:
        name: "IT Director"
        affiliation: "Information Technology"
        email: "it-director@company.com"
    - id: compliance-officer
      name: Compliance Officer
      type: Human
      contact:
        name: "Compliance Officer"
        affiliation: "Legal & Compliance"
        email: "compliance@company.com"
    - id: ciso
      name: Chief Information Security Officer
      type: Human
      contact:
        name: "Chief Information Security Officer"
        affiliation: "Executive Team"
        email: "ciso@company.com"
    - id: legal-counsel
      name: Legal Counsel
      type: Human
      contact:
        name: "Legal Counsel"
        affiliation: "Legal Department"
        email: "legal@company.com"
    - id: all-employees
      name: All Employees
      type: Group
      contact:
        name: "Employee Representative"
        affiliation: "Company-wide"
  roles:
    - id: it-director
      title: IT Director
    - id: compliance-officer
      title: Compliance Officer
    - id: ciso
      title: Chief Information Security Officer
    - id: legal-counsel
      title: Legal Counsel
    - id: all-employees
      title: All Employees
  assignments:
    - role-id: it-director
      party-ids: [it-director]
    - role-id: compliance-officer
      party-ids: [compliance-officer]
    - role-id: ciso
      party-ids: [ciso]
    - role-id: legal-counsel
      party-ids: [legal-counsel]
    - role-id: all-employees
      party-ids: [all-employees]

contacts:
  responsible:
    - it-director
    - compliance-officer
  accountable:
    - ciso
  consulted:
    - legal-counsel
  informed:
    - all-employees

scope:
  in:
    geopolitical:
      - "United States"
      - "European Union"
      - "Canada"
    technologies:
      - "Cloud Computing"
      - "Mobile Devices"
      - "Web Applications"
      - "Database Systems"

imports:
  catalogs:
    - reference-id: "NIST-800-53"
      constraints:
        - id: "nist-cloud-constraint"
          target-id: "AC-1"
          text: "Enhanced access control requirements for cloud environments"
  guidance:
    - reference-id: "ISO-27001"

adherence:
  evaluation-methods:
    - id: "EV-AUTO-01"
      type: "Behavioral"
      mode: "Automated"
      required: true
      description: "Automated compliance scanning of cloud environments"
    - id: "EV-MANUAL-01"
      type: "Behavioral"
      mode: "Manual"
      description: "Annual security audit by external assessors"
  enforcement-methods:
    - id: "EM-GATE-01"
      type: "Gate"
      mode: "Automated"
      required: true
      description: "Pre-deployment compliance gate in CI/CD pipeline"
  non-compliance: "Non-compliant systems will be quarantined pending remediation"
