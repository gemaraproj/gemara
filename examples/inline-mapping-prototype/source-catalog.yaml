# Synthetic structural example; not a compliance assessment.
title: Demonstration controls
metadata:
  id: DEMO-CONTROLS
  type: ControlCatalog
  gemara-version: "1.1.0"
  version: "1.0.0"
  description: Synthetic controls for testing inline mapping resolution.
  author:
    id: demo
    name: Example Author
    type: Human
  applicability-groups:
    - id: all
      title: All deployments
      description: Every demonstration deployment.
  mapping-references:
    - id: DEMO-LEGACY
      title: Demonstration legacy guidance
      version: "1.0.0"
groups:
  - id: operations
    title: Operations
    description: Demonstration operational controls.
controls:
  - id: DEMO.C01
    title: Dependency inventory
    objective: Maintain an inventory of deployed dependencies.
    group: operations
    assessment-requirements:
      - id: DEMO.C01.AR01
        text: Record dependencies for each deployed release.
        applicability: [all]
    guidelines:
      - reference-id: DEMO-LEGACY
        entries:
          - reference-id: LEGACY.G01
  - id: DEMO.C02
    title: Inventory review
    objective: Review dependency inventory changes.
    group: operations
    assessment-requirements:
      - id: DEMO.C02.AR01
        text: Review inventory changes before release.
        applicability: [all]
  - id: DEMO.C03
    title: Review ownership
    objective: Assign responsibility for inventory reviews.
    group: operations
    assessment-requirements:
      - id: DEMO.C03.AR01
        text: Name an owner for each inventory review.
        applicability: [all]
