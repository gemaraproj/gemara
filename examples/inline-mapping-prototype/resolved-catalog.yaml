# Synthetic resolved output; not a compliance assessment.
title: Demonstration controls
metadata:
  id: DEMO-CONTROLS
  type: ControlCatalog
  gemara-version: "1.1.0"
  version: "1.0.0"
  description: Synthetic controls for testing inline mapping resolution.
  author: {id: demo, name: Example Author, type: Human}
  applicability-groups:
    - {id: all, title: All deployments, description: Every demonstration deployment.}
    - {id: manual, title: Manual inventory, description: Inventory maintained manually.}
    - {id: automated, title: Automated inventory, description: Inventory collected automatically.}
  mapping-references:
    - {id: DEMO-LEGACY, title: Demonstration legacy guidance, version: "1.0.0"}
    - {id: DEMO-GUIDANCE, title: Demonstration inventory guidance, version: "1.0.0"}
groups:
  - {id: operations, title: Operations, description: Demonstration operational controls.}
controls:
  - id: DEMO.C01
    title: Dependency inventory
    objective: Maintain an inventory of deployed dependencies.
    group: operations
    assessment-requirements:
      - id: DEMO.C01.AR01
        text: Record dependencies for each deployed release.
        applicability: [all]
    guidelines:
      - reference-id: DEMO-LEGACY
        relationship: relates-to
        entries:
          - reference-id: LEGACY.G01
      - id: inventory-manual
        reference-id: DEMO-GUIDANCE
        relationship: implements
        remarks: Independent assertion for manual inventory collection.
        entries:
          - reference-id: DEMO.G01
            strength: 6
            confidence-level: Medium
            applicability: [manual]
            rationale: A release inventory addresses dependency identification but manual collection may omit dependencies.
            remarks: Demonstration score only.
      - id: inventory-automated
        reference-id: DEMO-GUIDANCE
        relationship: implements
        entries:
          - reference-id: DEMO.G01
            strength: 9
            confidence-level: High
            applicability: [automated]
            rationale: Automated collection covers the demonstration dependency identification requirement more completely.
  - id: DEMO.C02
    title: Inventory review
    objective: Review dependency inventory changes.
    group: operations
    assessment-requirements:
      - id: DEMO.C02.AR01
        text: Review inventory changes before release.
        applicability: [all]
    guidelines:
      - id: inventory-review
        reference-id: DEMO-GUIDANCE
        relationship: supports
        entries:
          - reference-id: DEMO.G01
            rationale: Reviewing inventory changes can detect missing dependencies.
          - reference-id: DEMO.G02
            strength: 7
            confidence-level: Medium
            rationale: Pre-release review addresses inventory accuracy but does not specify periodic review.
  - id: DEMO.C03
    title: Review ownership
    objective: Assign responsibility for inventory reviews.
    group: operations
    assessment-requirements:
      - id: DEMO.C03.AR01
        text: Name an owner for each inventory review.
        applicability: [all]
    guidelines:
      - id: ownership-gap
        reference-id: DEMO-GUIDANCE
        relationship: no-match
        remarks: The demonstration target guidance has no ownership requirement.
